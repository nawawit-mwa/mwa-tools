<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard ส่วนอ่านมาตร (สอม.) V6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#eef5fc; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e3e7ee; --grid:#eceff3;
  --text:#191919; --text-2:#5f6670; --text-3:#8a919b;
  --brand:#1f5fb3; --brand-2:#2a74d0;
  --s-cur:#257de0; --s-pre:#b4bcc7; --s-tgt:#f47230;
  --good:#006c10; --good-bg:#e6f4e8; --bad:#c22f30; --bad-bg:#fcebeb;
  --div-pos:#257de0; --div-neg:#ec4647;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:14px 20px 30px}
header.top{background:var(--brand);color:#fff;border-radius:14px;padding:12px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:20px;font-weight:700}
header.top .sub{opacity:.8;font-size:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls label{font-size:14px;opacity:.9}
select,button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:6px 10px;cursor:pointer}
header.top select{border-color:transparent}
header.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
header.top button:hover{background:rgba(255,255,255,.12)}
h2{font-size:18px;margin:14px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--text-2);font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:820px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.grid5{grid-template-columns:1fr}}
.na2{font-size:12px;color:var(--text-3);font-weight:400}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid4,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .lbl{font-size:14px;color:var(--text-2);font-weight:500}
.kpi .val{font-size:24px;font-weight:700;line-height:1.15;margin:2px 0 0;font-variant-numeric:tabular-nums}
.kpi .val .u{font-size:14px;font-weight:500;color:var(--text-2);margin-left:4px}
.kpi .na{font-size:18px;color:var(--text-3);margin:10px 0}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:13px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.cmp .k{color:var(--text-2);white-space:nowrap}
.cmp .v{color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right}
.cmp .chip{justify-self:end;font-size:12.5px;padding:1px 7px}
.chip{display:inline-flex;gap:3px;align-items:center;padding:1px 7px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.chip.up{color:var(--good);background:var(--good-bg)}
.chip.down{color:var(--bad);background:var(--bad-bg)}
.chip.flat{color:var(--text-2);background:var(--surface-2)}
.chip.neu{color:#1659b0;background:#e8f0fb}
.lay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.ltab tr.tot td{font-weight:700;border-top:1.5px solid #f2c94c}
.lay > .card{min-width:0}
.box{background:#fff6dc;border-color:#f2c94c;border-left:5px solid #f2b400}
.box h3,.chartbox h3{margin:0 0 6px;font-size:15px}
.blist{margin:0;padding-left:20px;font-size:13.5px}
.blist li{margin:6px 0}
.blist .nm{display:inline-block;min-width:100px}
.blist .r2{display:flex;align-items:center;gap:6px;margin-top:1px}
.blist b{font-size:18px;margin-right:3px}
.blist .u{color:var(--text-2);font-size:12.5px;margin-right:8px}
.blist .pv{color:var(--text-2);font-size:12.5px;margin-right:6px}
.chartbox{padding-bottom:6px}
.ch-head{display:flex;justify-content:space-between;align-items:center}
.chartbox text.cl{font-size:11px;fill:var(--text)}
.chartbox text.cv{font-size:10.5px;font-variant-numeric:tabular-nums}
.chartbox text.cv .c{font-weight:700;fill:#1659b0}
.chartbox text.cv .p{fill:var(--text-3)}
.ltab{font-size:13px}
.ltab th{background:transparent;border-bottom:1px solid #f2c94c}
.ltab td,.ltab th{padding:5px 6px;border-bottom:1px solid #f5dc8f}
.ltab td.rt{font-weight:700;font-size:15px}
.foot2{font-size:12.5px;color:var(--text-2);margin-top:6px}
.chartbox text.cl{font-size:12px}
.chartbox text.cv{font-size:12px}
@media (max-width:980px){.lay{grid-template-columns:1fr 1fr}.lay > .card{grid-column:auto / span 1 !important}.lay > .chartbox,.lay > .box{grid-column:1 / -1 !important}}
.detail{columns:2 380px;column-gap:12px}
.detail .card{break-inside:avoid;margin-bottom:12px;padding:10px 14px}
.detail .card h3{margin:0 0 6px;font-size:15px}
.detail table{font-size:13px}
.detail td,.detail th{padding:4px 6px}
.detail tr.tot td{font-weight:700;border-top:1.5px solid var(--line)}
.bar-wrap{margin-top:10px}
.bar-wrap .track{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.bar-wrap .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s-cur)}
.bar-wrap .tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--s-tgt);border-radius:1px}
.bar-wrap .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:6px 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--brand-2);color:#fff}
.chart-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.line{height:3px;width:16px;border-radius:2px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--text-2);font-size:12px}
.chart text.vl{font-size:10.5px;font-variant-numeric:tabular-nums}
.chart text.vl.pre{fill:var(--text-3)}
.chart text.vl.cur{fill:#1659b0;font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:8px;padding:8px 10px;font-size:13px;min-width:170px;opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--text-2);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--text-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
.scroll{overflow:auto;max-height:520px}
.rci .grp{font-size:13px;color:var(--text-2)}
.rci .share{font-size:13px;color:var(--text-2);margin-top:2px}
.divbar{position:relative;height:14px;min-width:160px}
.divbar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--text-3)}
.divbar .b{position:absolute;top:2px;height:10px}
.divbar .b.pos{left:50%;background:var(--div-pos);border-radius:0 4px 4px 0}
.divbar .b.neg{right:50%;background:var(--div-neg);border-radius:4px 0 0 4px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:0 5px;margin-right:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.note{font-size:13.5px;color:var(--text-2)}
.note ul{margin:6px 0 0;padding-left:20px}
.status{font-size:13px;color:#fff;opacity:.85}
.foot{margin-top:24px;font-size:12.5px;color:var(--text-3)}
</style>
</head>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>รายงานส่วนอ่านมาตร (สอม.) <span id="hMonth"></span></h1>
    </div>
    <div class="controls">
      <label for="selMonth">เดือน</label>
      <select id="selMonth"></select>
      <button id="btnLoad" title="โหลดไฟล์ .xlsx ที่ดาวน์โหลดจาก Google Sheet (โครงสร้างชีตเดิม)">โหลดไฟล์ใหม่ (.xlsx)</button>
      <input type="file" id="fileIn" accept=".xlsx,.xls" hidden>
      <span class="status" id="loadStatus"></span>
    </div>
  </header>

  <h2><span id="secTitle"></span> <small id="t1"></small></h2>
  <div class="lay" id="lay"></div>



  <h2>หมายเหตุข้อมูล</h2>
  <div class="card note" id="dataNote"></div>

  <div class="foot" id="foot"></div>
</div>

const MONTHS = ['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
const MONTHS_FULL = ['ตุลาคม','พฤศจิกายน','ธันวาคม','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน'];
/* agg: sum = รวมรายเดือน, last = ค่า ณ สิ้นงวด · good: ทิศที่ดี (up/down) · scale: แปลงหน่วยเพื่อแสดงผล */
/* good: up = เพิ่มขึ้นดี, down = ลดลงดี, none = ไม่ตัดสินดี/ไม่ดี (สีกลาง) · cols: 'all' = รวมทุกคอลัมน์ย่อย หรือ RegExp เลือกคอลัมน์ */
const METRICS = [
  {key:'bills',   sheet:'ออกบิลประจำเดือน', cols:'all', label:'ออกบิลประจำเดือน',        unit:'ราย',  dp:0, scale:1, agg:'sum', good:'up'},
  {key:'r3',      sheet:'แจ้ง ร.3',          cols:'all', label:'แจ้ง ร.3 ณ สถานที่ใช้น้ำ',  unit:'ราย',  dp:0, scale:1, agg:'sum', good:'none'},
  {key:'rt2',     sheet:'RT2',              cols:'all', label:'อ่านมาตรไม่ได้ (RT2)',     unit:'ราย',  dp:0, scale:1, agg:'sum', good:'down'},
  {key:'req',     sheet:'คำร้องต่างๆ',       cols:'all', label:'คำร้องต่างๆ (รวม)',        unit:'เรื่อง', dp:0, scale:1, agg:'sum', good:'down'},
  {key:'chgR1',   sheet:'เปลี่ยนประเภท',      cols:/R1\s*เป็น\s*R2/, label:'เปลี่ยนประเภท R1 → R2', unit:'ราย', dp:0, scale:1, agg:'sum', good:'none'},
  {key:'chgR2',   sheet:'เปลี่ยนประเภท',      cols:/R2\s*เป็น\s*R1/, label:'เปลี่ยนประเภท R2 → R1', unit:'ราย', dp:0, scale:1, agg:'sum', good:'none'},
  {key:'leakAmt', sheet:'ลดหย่อนท่อรั่ว',      cols:/จำนวนเงิน/,   label:'ลดหย่อนท่อรั่ว (บาท)', unit:'บาท', dp:2, scale:1, agg:'sum', good:'none'},
  {key:'leakCnt', sheet:'ลดหย่อนท่อรั่ว',      cols:/จำนวนลูกค้า/, label:'ลดหย่อนท่อรั่ว (ราย)', unit:'ราย', dp:0, scale:1, agg:'sum', good:'none'},
];
const DETAIL = [{sheet:'ยกเลิกบิล'}];

let D = null;
let state = {m:0, metric:'bills', mode:'month'};

/* ---------- parsing ---------- */
const num = v => (v===null||v===undefined||v==='') ? null : (isFinite(+v) ? +v : null);
function findSheet(book, name){
  if (book[name]) return book[name];
  const norm = s => String(s).trim().replace(/\s+/g,'').toLowerCase();
  const k = Object.keys(book).find(k=>norm(k)===norm(name));
  return k ? book[k] : null;
}
/* อ่านชีตรูปแบบ Fiscal month | month order | Year label | Metric type | คอลัมน์ข้อมูล... */
function parseSheet(rows){
  const hdr = rows[0].map(x=>String(x??'').trim());
  const cols = []; for (let c=4;c<hdr.length;c++) if (hdr[c]) cols.push({c, name: hdr[c]==='value' ? 'จำนวน' : hdr[c]});
  const mk = () => Array.from({length:12},()=>null);
  const o = {cols, pre:mk(), cur:mk(), fy:null};
  for (const r of rows.slice(1)){
    const mo=num(r[1]), t=String(r[3]||'').trim().toLowerCase(), yr=num(r[2]); if(!mo||mo<1||mo>12) continue;
    const s = t==='actual pre'?'pre':(t==='actual curr'?'cur':null); if(!s) continue;
    const vals = cols.map(k=>num(r[k.c]));
    if (vals.every(v=>v==null)) continue;           // ทั้งแถวว่าง = ยังไม่มีข้อมูล
    o[s][mo-1] = vals;
    if (s==='cur' && yr) o.fy = mo<=3 ? yr+1 : yr;
  }
  return o;
}
function normalize(book){
  const out = {sheets:{}};
  const need = [...new Set([...METRICS.map(m=>m.sheet), ...DETAIL.map(d=>d.sheet)])];
  for (const s of need){ const rows=findSheet(book,s); if(!rows) throw new Error('ไม่พบชีต "'+s+'"'); out.sheets[s]=parseSheet(rows); }
  for (const m of METRICS){
    const S = out.sheets[m.sheet];
    const idx = S.cols.map((k,i)=>i).filter(i=> m.cols==='all' || m.cols.test(S.cols[i].name));
    const agg = row => { if(!row) return null; const v=idx.map(i=>row[i]).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0) : null; };
    out[m.key] = {pre:S.pre.map(agg), cur:S.cur.map(agg)};
  }
  const fy = out.sheets[METRICS[0].sheet].fy;
  out.fyTh = fy ? (fy<2400 ? fy+543 : fy) : null;
  out.latest = METRICS.reduce((mx,m)=>out[m.key].cur.reduce((a,v,i)=>v!=null?i:a,-1)>mx?out[m.key].cur.reduce((a,v,i)=>v!=null?i:a,-1):mx,-1);
  out.has = Array.from({length:12},(_,i)=>METRICS.some(m=>out[m.key].cur[i]!=null));
  return out;
}

/* ---------- calculations ---------- */
function cumSum(arr, m){ let s=0; for(let i=0;i<=m;i++){ if(arr[i]==null) return null; s+=arr[i]; } return s; }
const cfg = key => METRICS.find(x=>x.key===key);
function valueAt(key, series, m, mode){
  const arr = D[key][series];
  if (mode==='month' || cfg(key).agg==='last') return arr[m];
  return cumSum(arr, m);
}
/* ค่าเดือนก่อนหน้า: ต.ค. เทียบ ก.ย. ของปีก่อน */
function prevMonth(key, m){ return m>0 ? valueAt(key,'cur',m-1,'month') : valueAt(key,'pre',11,'month'); }
const sc = (key,v) => v==null ? null : v*(cfg(key).scale||1);

/* ---------- formatting ---------- */
const fmt = (v,dp)=> v==null ? '–' : v.toLocaleString('th-TH',{minimumFractionDigits:dp,maximumFractionDigits:dp});
function chip(cur, base, dp, good='up'){
  if (cur==null || base==null) return '<span class="chip flat">–</span>';
  const d = cur-base;
  if (Math.abs(d) < Math.pow(10,-dp)/2) return `<span class="chip flat" title="เท่าเดิม">● 0%</span>`;
  const cls = good==='none' ? 'neu' : (((d>0) === (good==='up')) ? 'up' : 'down');
  const ic = d>0?'▲':'▼', sign = d>0?'+':'';
  const txt = base!==0 ? `${sign}${fmt(d/Math.abs(base)*100,2)}%` : `${sign}${fmt(d,dp)}`;
  const judge = cls==='neu' ? '' : (cls==='up' ? ' (ดีขึ้น)' : ' (แย่ลง)');
  return `<span class="chip ${cls}" title="${d>0?'เพิ่มขึ้น':'ลดลง'} ${sign}${fmt(d,dp)}${judge}">${ic} ${txt}</span>`;
}

/* ---------- KPI cards ---------- */
function kpiCard(m){
  const c=sc(m.key,valueAt(m.key,'cur',state.m,'month')), p=sc(m.key,valueAt(m.key,'pre',state.m,'month'));
  const pm=sc(m.key,prevMonth(m.key,state.m));
  return `<div class="card kpi">
    <div class="lbl">${m.label}</div>
    ${c==null ? '<div class="na">ยังไม่มีข้อมูลเดือนนี้</div>' : `<div class="val">${fmt(c,m.dp)}<span class="u">${m.unit}</span></div>`}
    <div class="cmp">
      <span class="k">ค่าปีก่อน</span><span class="v">${fmt(p,m.dp)}</span>${chip(c,p,m.dp,m.good)}
      <span class="k">ค่าเดือนก่อน</span><span class="v">${fmt(pm,m.dp)}</span>${chip(c,pm,m.dp,m.good)}
    </div>
  </div>`;
}
/* แถวเทียบในกล่องรายละเอียด */
const sub = (S, i, m) => { const c=S.cur[m]?.[i] ?? null, p=S.pre[m]?.[i] ?? null; return {c,p}; };
function rt2Box(){
  const S=D.sheets['RT2'], m=state.m;
  const prvRow = m>0 ? S.cur[m-1] : S.pre[11];
  let rows = S.cols.map((k,i)=>{ const c=S.cur[m]?.[i] ?? null, q=prvRow?.[i] ?? null;
    return `<tr><td>${i+1}. ${k.name}</td><td><b>${fmt(c,0)}</b></td><td>${fmt(q,0)}</td><td>${chip(c,q,0,'down')}</td></tr>`; }).join('');
  const sm = r => r ? r.reduce((a,b)=>a+(b||0),0) : null;
  const c=sm(S.cur[m]), q=sm(prvRow);
  rows += `<tr class="tot"><td>รวม</td><td><b>${fmt(c,0)}</b></td><td>${fmt(q,0)}</td><td>${chip(c,q,0,'down')}</td></tr>`;
  return `<div class="card box">
    <h3>อ่านมาตรไม่ได้ <span class="na2">(ราย)</span></h3>
    <table class="ltab"><thead><tr><th>รายการ</th><th>เดือนนี้</th><th>ค่าเดือนก่อน</th><th>เทียบ</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function reqChart(){
  const S=D.sheets['คำร้องต่างๆ'], m=state.m;
  const rows = S.cols.map((k,i)=>({n:k.name, c:S.cur[m]?.[i] ?? null})).sort((a,b)=>(b.c??-1)-(a.c??-1));
  const W=560, LW=135, RH=20, T=4, H=T+rows.length*RH+2, pw=W-LW-36;
  const mx=Math.max(1,...rows.map(r=>r.c||0));
  let s='';
  rows.forEach((r,i)=>{ const y=T+i*RH, wc=(r.c||0)/mx*pw;
    s+=`<text x="${LW-6}" y="${y+13}" text-anchor="end" class="cl">${r.n}</text>`;
    s+=`<rect x="${LW}" y="${y+4}" width="${Math.max(wc,1.5)}" height="11" rx="3" fill="var(--s-cur)"/>`;
    s+=`<text x="${LW+wc+6}" y="${y+13}" class="cv"><tspan class="c">${fmt(r.c,0)}</tspan></text>`;
  });
  return `<div class="card chartbox">
    <div class="ch-head"><h3>คำร้องต่างๆ <span class="na2">(เรื่อง · เดือน ${MONTHS_FULL[m]})</span></h3></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟคำร้องต่างๆ แยกประเภท">${s}</svg>
  </div>`;
}
function leakBox(){
  const S=D.sheets['ลดหย่อนท่อรั่ว'], m=state.m;
  const col = re => S.cols.findIndex(k=>re.test(k.name));
  const v = i => i>=0 ? (S.cur[m]?.[i] ?? null) : null;
  const rows = ['10%','15%','20%'].map(r=>{ const ia=col(new RegExp('จำนวนเงิน\\s*'+r)), ic=col(new RegExp('จำนวนลูกค้า\\s*'+r));
    return `<tr><td class="rt">${r}</td><td><b>${fmt(v(ia),2)}</b></td><td><b>${fmt(v(ic),0)}</b></td></tr>`; }).join('');
  const iw=col(/ชดเชย/);
  return `<div class="card box">
    <h3>ลดหย่อนท่อรั่ว</h3>
    <table class="ltab"><thead><tr><th>อัตรา</th><th>จำนวนเงิน (บาท)</th><th>จำนวนราย</th></tr></thead><tbody>${rows}</tbody></table>
    ${iw>=0?`<div class="foot2">ชดเชยเป็นจำนวนน้ำ: <b>${fmt(v(iw),0)}</b> ลบ.ม.</div>`:''}
  </div>`;
}

function cancelBox(){
  const S=D.sheets['ยกเลิกบิล'], m=state.m;
  const prvRow = m>0 ? S.cur[m-1] : S.pre[11];
  const sm = r => r ? r.reduce((a,b)=>a+(b||0),0) : null;
  let rows = S.cols.map((k,i)=>{ const c=S.cur[m]?.[i] ?? null, q=prvRow?.[i] ?? null;
    return `<tr><td>${i+1}. ${k.name}</td><td><b>${fmt(c,0)}</b></td><td>${fmt(q,0)}</td><td>${chip(c,q,0,'down')}</td></tr>`; }).join('');
  const c=sm(S.cur[m]), q=sm(prvRow);
  rows += `<tr class="tot"><td>รวม</td><td><b>${fmt(c,0)}</b></td><td>${fmt(q,0)}</td><td>${chip(c,q,0,'down')}</td></tr>`;
  const py = sm(S.pre[m]);
  return `<div class="card box">
    <h3>ยกเลิกบิล <span class="na2">(ราย)</span></h3>
    <table class="ltab"><thead><tr><th>สาเหตุ</th><th>เดือนนี้</th><th>ค่าเดือนก่อน</th><th>เทียบ</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot2">เดือนเดียวกันของปีก่อน: <b>${fmt(py,0)}</b> ราย ${chip(c,py,0,'down')}</div>
  </div>`;
}

function renderLayout(){
  const card = k => kpiCard(METRICS.find(x=>x.key===k));
  const pos = (html, col, span=1) => html.replace('class="card', `style="grid-column:${col} / span ${span}" class="card`);
  document.getElementById('lay').innerHTML =
    ['bills','r3','rt2','req'].map((k,i)=>pos(card(k),i+1)).join('') +
    pos(rt2Box(),1,2) + pos(reqChart(),3,2) +
    ['chgR1','chgR2','leakAmt','leakCnt'].map((k,i)=>pos(card(k),i+1)).join('') +
    pos(cancelBox(),1,2) + pos(leakBox(),3,2);
}


/* ---------- data note ---------- */
function renderNote(){
  const k0=METRICS[0].key, curMonths = D.has.filter(Boolean).length;
  const lk = D.sheets['ลดหย่อนท่อรั่ว'];
  let odd=[];
  if (lk){ const iA=lk.cols.findIndex(c=>/จำนวนเงิน 10%/.test(c.name)), iC=lk.cols.findIndex(c=>/จำนวนลูกค้า 10%/.test(c.name));
    ['pre','cur'].forEach(s=>lk[s].forEach((r,i)=>{ if(r && iA>=0 && iC>=0 && r[iC]>0 && !r[iA]) odd.push(`${MONTHS[i]} ${s==='pre'?'ปีก่อน':'ปีนี้'}`); })); }
  document.getElementById('dataNote').innerHTML = `<ul>
    <li>มีผลจริงปีปัจจุบัน ${curMonths} เดือน · ไฟล์นี้ไม่มีเป้าหมาย จึงเทียบกับเดือนเดียวกันปีก่อนและเดือนก่อนหน้า (เดือน ต.ค. เทียบ ก.ย. ของปีก่อน)</li>
    <li>การ์ดที่เป็น "รวม" = ผลรวมคอลัมน์ย่อยในชีตนั้น เช่น RT2 = บ้านปิด + มีสิ่งกีดขวาง · ลดหย่อนท่อรั่ว แยกเป็นจำนวนเงิน (10%+15%+20%) และจำนวนราย (10%+15%+20%) · ชดเชยเป็นจำนวนน้ำ แสดงในกล่องลดหย่อนท่อรั่ว</li>
    <li>สีของ %: เขียว = ทิศที่ดี, แดง = ทิศที่ไม่ดี (RT2 / คำร้อง ลดลง = ดี) · สีน้ำเงิน = ไม่ตัดสินดีหรือไม่ดี (เปลี่ยนประเภท, แจ้ง ร.3, ลดหย่อนท่อรั่ว)</li>
    <li>ยกเลิกบิล = รวมสาเหตุ เลขน้ำไม่ถูกต้อง + HH ประเมินปริมาณน้ำ + อื่นๆ (ลดลง = ดี)</li>
    <li>แถวที่ทุกคอลัมน์ว่างถือว่ายังไม่มีข้อมูล</li>
    ${odd.length?`<li>ควรตรวจข้อมูล: ลดหย่อน 10% มีจำนวนลูกค้าแต่จำนวนเงินเป็น 0 ในเดือน ${odd.join(', ')}</li>`:''}
  </ul>`;
}


/* ---------- wiring ---------- */
function renderAll(){
  const fy = D.fyTh ? `ปีงบ ${D.fyTh}` : '';
  document.getElementById('hMonth').textContent = `ประจำเดือน ${MONTHS_FULL[state.m]} ${fy?'('+fy+')':''}`;
  document.getElementById('secTitle').textContent = `เดือน ${MONTHS_FULL[state.m]}`;
  document.getElementById('t1').textContent = `เทียบค่าปีก่อน (เดือนเดียวกันของปีก่อน) และค่าเดือนก่อน (เดือนก่อนหน้า) · ชี้ที่ % เพื่อดูค่าต่าง`;
  renderLayout();
}
function setup(book, sourceLabel){
  D = normalize(book);
  state.m = Math.max(0, D.latest);
  const sel = document.getElementById('selMonth');
  sel.innerHTML = MONTHS_FULL.map((n,i)=>`<option value="${i}" ${!D.has[i]?'disabled':''}>${n}${!D.has[i]?' (ยังไม่มีผล)':''}</option>`).join('');
  sel.value = state.m;
  renderNote(); renderAll();
  document.getElementById('foot').textContent = `แหล่งข้อมูล: ${sourceLabel} · ปีก่อน = ปีงบ ${D.fyTh?D.fyTh-1:''}, ปัจจุบัน = ปีงบ ${D.fyTh||''}`;
}

    st.textContent='กำลังอ่านไฟล์…';
    if (!window.XLSX) await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('โหลดตัวอ่าน xlsx ไม่ได้ (ต้องต่ออินเทอร์เน็ต)'));document.head.appendChild(s);});
    const wb = XLSX.read(await f.arrayBuffer(),{type:'array'});
    const book={}; wb.SheetNames.forEach(n=>book[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true}));
    setup(book, f.name); st.textContent='โหลดแล้ว: '+f.name;
  }catch(err){ st.textContent='⚠ '+err.message; }
  e.target.value='';
});

setup(RAW, 'สอม_BI_1.xlsx (ข้อมูลฝังในไฟล์)');
</script>
</body>
</html>
